[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "linguawiki"
version = "0.1.0"
description = "Local-first, language-agnostic learning system operated through typed CLI contracts"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "LinguaWiki contributors" }]
license = "MIT"
dependencies = [
  "duckdb==1.5.5",
  "jinja2==3.1.6",
  "jsonschema==4.25.1",
  "packaging==26.3",
  "pydantic==2.11.7",
  "rfc3339-validator==0.1.4",
]

[project.scripts]
linguawiki = "linguawiki.cli:main"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-xdist==3.8.0",
  "pyyaml==6.0.2",
  "ruff==0.12.8",
  "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linguawiki"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "linguawiki/resources/skills"
"config/privacy-policy.toml" = "linguawiki/resources/config/privacy-policy.toml"
"language-packs" = "linguawiki/resources/language-packs"
"schemas" = "linguawiki/resources/schemas"
"templates" = "linguawiki/resources/templates"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["linguawiki"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["external: requires a locally installed external runtime"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
